<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#9575cd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Чат команды">
<meta name="application-name" content="Чат команды">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Чат команды</title>
<link rel="stylesheet" href="style.css">

<!-- === FIREBASE SDK === -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body class="dark">
<div class="toast-container" id="toast-container"></div>

<!-- === СТРАНИЦА: АВТОРИЗАЦИЯ === -->
<div id="page-auth" class="page">
<div class="header">
<div class="header-left"></div>
<div class="header-center">
<h1 class="app-title">Чат команды</h1>
<div class="app-subtitle">авторизация</div>
</div>
<div class="header-right">
<button class="btn-refresh-round btn-refresh-back-color" onclick="refreshPage(this)" title="Обновить">↻</button>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</div>
</div>
<div style="max-width: 400px; margin: 40px auto; padding: 20px;">
<div style="text-align: center; margin-bottom: 30px;">
<div style="font-size: 64px; margin-bottom: 10px;">💬</div>
<h2 style="color: #90caf9; margin-bottom: 10px;">Войдите в аккаунт</h2>
<p style="color: #888; font-size: 14px;">Те же аккаунты, что и в основном приложении</p>
</div>
<div id="auth-form-email">
<input type="text" id="register-name" placeholder="Ваше имя" style="margin-bottom: 10px; display: none;">
<input type="email" id="login-email" class="search-box" placeholder="Email" autocomplete="email">
<input type="password" id="login-password" class="search-box" placeholder="Пароль" autocomplete="current-password">
<button class="btn-main btn-accent-save" onclick="loginWithEmail()">Войти</button>
<button class="btn-secondary" onclick="showRegisterForm()" style="width: 100%; margin-top: 10px;">📝 Создать аккаунт</button>
</div>
<div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #444;">
<button class="btn-secondary" onclick="resetPassword()" style="width: 100%; margin-bottom: 10px; background: #546e7a;">🔑 Забыл пароль</button>
<button class="btn-secondary" onclick="resendVerification()" style="width: 100%; background: #607d8b;">📧 Не приходит письмо?</button>
</div>
<div id="auth-error" style="color: #ef5350; text-align: center; margin-top: 15px; display: none;"></div>
</div>
</div>

<!-- === СТРАНИЦА: ВЫБОР КОМАНДЫ === -->
<div id="page-home" class="page">
<div class="header">
<div class="header-left">
<button class="btn-logout-round" onclick="logout()" title="Выйти из аккаунта">🚪</button>
</div>
<div class="header-center">
<h1 class="app-title">Чат команды</h1>
<div class="app-subtitle">выберите команду</div>
</div>
<div class="header-right">
<button class="btn-refresh-round" onclick="refreshPage(this)" title="Обновить">↻</button>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
</div>
</div>
<div style="padding: 10px;">
<button id="push-toggle-btn" class="btn-secondary" style="width:100%;margin-bottom:10px;" onclick="togglePushNotifications()">🔔 Включить уведомления о сообщениях</button>
<div id="home-teams-list"></div>
</div>
</div>

<!-- === СТРАНИЦА: ЧАТ КОМАНДЫ === -->
<div id="page-team-chat" class="page">
<div class="chat-page-header" id="chat-page-header">
<button class="btn-back" onclick="closeTeamChat()">←</button>
<div id="chat-team-avatar" class="team-members-header-avatar"></div>
<h2 id="chat-team-name"></h2>
</div>
<div id="chat-pinned-banner" style="display:none;align-items:center;gap:8px;padding:8px 12px;background:rgba(66,165,245,0.1);border-bottom:1px solid rgba(255,255,255,0.08);cursor:pointer;"></div>
<div id="chat-messages-list" onscroll="handleChatScroll(this)"></div>
<button id="chat-scroll-down" onclick="chatScrollDownClick()" title="Вниз" style="display:none;">
<span style="font-size:20px;line-height:1;">▼</span>
<span id="chat-scroll-down-badge" style="display:none;"></span>
</button>
<div id="chat-input-bar">
<div id="chat-reply-preview" style="display:none;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,0.05);border-top:1px solid rgba(255,255,255,0.08);"></div>
<div style="display:flex;padding:8px 10px;background:rgba(0,0,0,0.15);">
<div style="position:relative;flex:1;background:#1e1e1e;border-radius:22px;display:flex;align-items:flex-end;">
<textarea id="chat-input" rows="1" placeholder="Сообщение" style="flex:1;resize:none;background:transparent;border:none;outline:none;color:#eee;padding:9px 44px 9px 14px;font-family:inherit;font-size:15px;line-height:1.3;height:38px;max-height:98px;overflow-y:hidden;box-sizing:border-box;" onkeydown="handleChatInputKeydown(event)" oninput="autoGrowChatInput(this); handleChatInputChange(this)" onblur="setTimeout(closeMentionPopupIfIdle, 150)"></textarea>
<button style="position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;padding:0;border:none;background:#42a5f5;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;" onclick="withButtonSpinner(this, () => sendOrEditChatMessage())">➤</button>
</div>
</div>
</div>
</div>

<!-- === МОДАЛКА: УЧАСТНИКИ КОМАНДЫ === -->
<div id="modal-team-members" class="modal modal-fullscreen">
<div class="modal-content modal-content-full">
<div class="team-members-header">
<div id="team-members-avatar" class="team-members-header-avatar">🎸</div>
<h2 id="team-members-name" style="margin:0;flex:1;"></h2>
<button class="btn-icon" onclick="closeTeamMembers()">✕</button>
</div>
<div class="search-wrap"><input type="text" id="team-members-search" class="search-box" placeholder="🔍 Поиск участника..." oninput="renderTeamMembersList(); toggleSearchClearBtn(this)"><button type="button" class="search-clear-btn" onclick="clearSearchInput('team-members-search', renderTeamMembersList)">✕</button></div>
<div id="team-members-list"></div>
</div>
</div>

<!-- === МОДАЛКА: ПРОФИЛЬ УЧАСТНИКА === -->
<div id="modal-member-profile" class="modal" style="z-index: 2100;">
<div class="modal-content" style="text-align:center;">
<div id="member-profile-avatar" class="member-profile-avatar">👤</div>
<h2 id="member-profile-name" style="margin:10px 0 4px;"></h2>
<div id="member-profile-email" style="color:#888;font-size:12px;font-weight:normal;margin-bottom:15px;"></div>
<div id="member-profile-details" style="text-align:left;"></div>
<button class="btn-secondary" style="width:100%;margin-top:15px;" onclick="closeModal('modal-member-profile')">Закрыть</button>
</div>
</div>

<!-- === МОДАЛКА: ФОТО НА ВЕСЬ ЭКРАН === -->
<div id="modal-photo-view" class="modal" style="z-index: 2200;background:rgba(0,0,0,0.95);" onclick="closeModal('modal-photo-view')">
<img id="photo-view-img" src="" alt="" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;">
</div>

<script src="state-utils.js"></script>
<script src="utils.js"></script>
<script src="init.js"></script>
<script src="cloud-sync.js"></script>
<script src="teams.js"></script>
<script src="team-members.js"></script>
<script src="push.js"></script>
<script src="auth.js"></script>
</body>
</html>
